name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Start SUT
        run: java -jar ./artifacts/app-order.jar &

      - name: Wait for SUT
        run: curl --retry 20 --retry-delay 2 --retry-connrefused -s -o /dev/null http://localhost:9999

      - name: Run tests
        run: ./gradlew test --info